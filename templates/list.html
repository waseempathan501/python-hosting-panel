<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — Waseem Visuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="phone-shell">

  <header class="hero hero-small">
    <div class="hero-top">
      <a class="icon-btn" href="{{ url_for('home') }}" aria-label="Back">←</a>
      <div class="pill">{{ title.upper() }}</div>
      <div class="rainbow-dot" aria-hidden="true"></div>
    </div>
  </header>

  <main class="dash">
    <div class="recent standalone">
      {% if files %}
      <div class="recent-list">
        {% for f in files %}
        <a class="recent-item" href="{{ f.url }}" target="_blank" rel="noopener">
          <span class="tag tag-{{ f.category }}">{{ f.category }}</span>
          <span class="rname">{{ f.name }}</span>
          <span class="chev">↗</span>
        </a>
        {% endfor %}
      </div>
      {% else %}
      <p class="empty">Nothing hosted here yet.</p>
      {% endif %}
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="{{ url_for('home') }}" class="nav-item {{ 'active' if title == 'Home' }}">
      <span class="nav-icon">⌂</span><span>Home</span>
    </a>
    <a href="{{ url_for('projects') }}" class="nav-item {{ 'active' if title == 'Projects' }}">
      <span class="nav-icon">💼</span><span>Projects</span>
    </a>
    <a href="{{ url_for('portfolio') }}" class="nav-item {{ 'active' if title == 'Portfolio' }}">
      <span class="nav-icon">🪪</span><span>Portfolio</span>
    </a>
  </nav>

</div>
</body>
</html>
